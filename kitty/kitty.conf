# Kitty config for use with tmux

# ----- Font -----
font_family      JetBrains Mono
font_size        14.0
# If you prefer your existing font:
# font_family    Operator Mono

# ----- Theme (Pencil Light - see bottom of file) -----

# ----- Tabs -----
tab_bar_edge top

# ----- Window -----
window_padding_width 4
hide_window_decorations titlebar-only
# macos_titlebar_color background

# ----- Performance -----
repaint_delay 10
input_delay 3
sync_to_monitor yes

# ----- Bell -----
enable_audio_bell no
visual_bell_duration 0

# ----- Cursor -----
cursor_blink_interval 0
shell_integration enabled

# ----- Scrollback -----
scrollback_lines 10000

# ----- Keyboard -----
# Make Option work as Alt/Meta (word movement, Option+Enter, etc.)
macos_option_as_alt yes

# Since you're using tmux, we keep kitty simple
# Let tmux handle splits/tabs

# macOS shortcuts
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+n new_os_window
map cmd+w close_window
map cmd+q quit

# Increase/decrease font size
map cmd+plus change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0 change_font_size all 0

# Clear screen (Cmd+K) - works with tmux
map cmd+k send_text all \x01\x0b

# Option+Enter - send literal newline (for multi-line input in zsh/claude code)
map opt+enter send_text all \n

# BEGIN_KITTY_THEME
# Pencil Light
include current-theme.conf
# END_KITTY_THEME