# tmux config for kitty + vim workflow

# ----- Better prefix -----
# Ctrl-a is easier than Ctrl-b (and matches screen)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ----- Essential for vim -----
# Fast escape (otherwise vim mode switching is laggy)
set -sg escape-time 10
# Send focus events to apps (needed for nvim pane dimming)
set -g focus-events on

# ----- Colors -----
# True color support (important for themes)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-kitty:RGB"

# ----- Mouse -----
# Enable mouse (helpful when starting out)
set -g mouse on

# ----- Indexing -----
# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# ----- Splits -----
# More intuitive split keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ----- Navigation -----
# vim-style pane navigation (prefix + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt+Arrow for word navigation (forwarded to shell)
bind -n M-Left send-keys Escape b
bind -n M-Right send-keys Escape f

# ----- Resizing -----
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ----- Windows -----
# Quick window navigation
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# ----- Windows -----
# Renumber windows when one is closed (no gaps)
set -g renumber-windows on
# Auto-rename windows to show running command
setw -g automatic-rename on

# ----- Reload config -----
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ----- Clear pane (like Cmd-K) -----
bind C-k send-keys -R \; clear-history \; send-keys Enter

# ----- History -----
set -g history-limit 50000

# ----- Status bar (Piatto Light colors) -----
set -g status-position bottom
set -g status-style "bg=#e8e8e8,fg=#414141"
set -g status-left-length 40
set -g status-left "#[fg=#ffffff,bg=#3b5ea7,bold] #S #[fg=#3b5ea7,bg=#e8e8e8]"
set -g status-right "#[fg=#f1f1f1]#[fg=#414141,bg=#f1f1f1] %H:%M #[fg=#3b5ea7]#[fg=#ffffff,bg=#3b5ea7,bold] #h "

# Pane borders
set -g pane-border-style "fg=#f1f1f1"
set -g pane-active-border-style "fg=#3b5ea7"

# Dim inactive panes
set -g window-style "fg=#808080,bg=#e8e8e8"
set -g window-active-style "fg=#414141,bg=#ffffff"

# ----- Copy mode (vim-style) -----
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"