# tmux config for kitty + vim workflow

# ----- Better prefix -----
# Ctrl-a is easier than Ctrl-b (and matches screen)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ----- Essential for vim -----
# Fast escape (otherwise vim mode switching is laggy)
set -sg escape-time 10
# Send focus events to apps (needed for nvim pane dimming)
set -g focus-events on

# ----- Colors -----
# True color support (important for themes)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-kitty:RGB"

# ----- Mouse -----
# Enable mouse (helpful when starting out)
set -g mouse on

# ----- Indexing -----
# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# ----- Splits -----
# More intuitive split keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ----- Navigation -----
# vim-style pane navigation (prefix + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt+Arrow for word navigation (forwarded to shell)
bind -n M-Left send-keys Escape b
bind -n M-Right send-keys Escape f

# ----- Resizing -----
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ----- Windows -----
# Quick window navigation
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# ----- Windows -----
# Renumber windows when one is closed (no gaps)
set -g renumber-windows on
# Auto-rename windows to the current folder name (until manually renamed)
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

# ----- Reload config -----
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ----- Clear pane (like Cmd-K) -----
bind C-k send-keys -R \; clear-history \; send-keys Enter

# ----- History -----
set -g history-limit 50000

# ----- Status bar (Rose Pine Moon colors) -----
set -g status-position top
set -g status-style "bg=#393552,fg=#e0def4"
set -g status-left ""
set -g status-right "#[fg=#2a283e]#[fg=#e0def4,bg=#2a283e] %H:%M #[fg=#3e8fb0]#[fg=#2a273f,bg=#3e8fb0,bold] #h "

# Window tabs
set -g window-status-format " #I:#W#F "
set -g window-status-style "fg=#908caa,bg=#393552"
set -g window-status-current-format " #I:#W#F "
set -g window-status-current-style "fg=#2a273f,bg=#3e8fb0,bold"
set -g window-status-separator ""

# Pane borders
set -g pane-border-lines heavy
set -g pane-border-style "fg=#6e6a86"
set -g pane-active-border-style "fg=#3e8fb0"

# Dim inactive panes
set -g window-style "fg=#6e6a86,bg=#393552"
set -g window-active-style "fg=#e0def4,bg=#232136"

# ----- Copy mode (vim-style) -----
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"