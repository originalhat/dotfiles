# tmux config for kitty + vim workflow

# ----- Better prefix -----
# Ctrl-a is easier than Ctrl-b (and matches screen)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ----- Essential for vim -----
# Fast escape (otherwise vim mode switching is laggy)
set -sg escape-time 10

# ----- Colors -----
# True color support (important for themes)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-kitty:RGB"

# ----- Mouse -----
# Enable mouse (helpful when starting out)
set -g mouse on

# ----- Indexing -----
# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# ----- Splits -----
# More intuitive split keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ----- Navigation -----
# vim-style pane navigation (prefix + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt+Arrow for word navigation (forwarded to shell)
bind -n M-Left send-keys Escape b
bind -n M-Right send-keys Escape f

# ----- Resizing -----
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ----- Windows -----
# Quick window navigation
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# ----- Reload config -----
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ----- Clear pane (like Cmd-K) -----
bind C-k send-keys -R \; clear-history \; send-keys Enter

# ----- History -----
set -g history-limit 50000

# ----- Status bar (Catppuccin Mocha colors) -----
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=#1e1e2e]"
set -g status-right "#[fg=#45475a]#[fg=#cdd6f4,bg=#45475a] %H:%M #[fg=#89b4fa]#[fg=#1e1e2e,bg=#89b4fa,bold] #h "

# Window status
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7,bold] #I:#W "

# Pane borders
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

# Dim inactive panes
set -g window-style "fg=#585b70,bg=#11111b"
set -g window-active-style "fg=#cdd6f4,bg=#1e1e2e"

# ----- Copy mode (vim-style) -----
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"